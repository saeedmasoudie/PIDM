name: Release PIDM installers

on:
  workflow_dispatch:

run-name: Build PIDM installers and publish release

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: pidm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(
            python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("core/build_info.py").read_text(encoding="utf-8"))
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              if not any(
                  isinstance(target, ast.Name) and target.id == "APP_VERSION"
                  for target in node.targets
              ):
                  continue
              if isinstance(node.value, ast.Constant):
                  print(str(node.value.value))
                  break
          else:
              raise SystemExit("APP_VERSION was not found in core/build_info.py")
          PY
          )"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid APP_VERSION: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building PIDM $VERSION"

      - name: Check whether release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" \
            --silent 2>/dev/null; then
            echo "PIDM v${VERSION} will be rebuilt and replaced."
          else
            echo "PIDM v${VERSION} will be built and published."
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Validate Python and translations
        run: |
          python -m compileall -q controllers core models scripts main.py pidm.spec
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          catalogs = {
              path.stem: json.loads(path.read_text(encoding="utf-8"))
              for path in Path("translations").glob("*.json")
          }
          english = set(catalogs["en"])
          for language, catalog in catalogs.items():
              if set(catalog) != english:
                  missing = sorted(english - set(catalog))
                  extra = sorted(set(catalog) - english)
                  raise SystemExit(
                      f"{language}: missing={missing}, extra={extra}"
                  )

          used = set()
          pattern = re.compile(r'(?:translate|\btr)\(\s*["\']([^"\']+)')
          for path in Path("qml").rglob("*.qml"):
              used.update(pattern.findall(path.read_text(encoding="utf-8")))
          missing = sorted(used - english)
          if missing:
              raise SystemExit(
                  "Missing English translation keys: " + ", ".join(missing)
              )
          print(
              f"Validated {len(catalogs)} catalogs with "
              f"{len(english)} keys."
          )
          PY

      - name: Validate extension
        shell: bash
        run: |
          set -euo pipefail
          for file in extension/*.js; do
            node --check "$file"
          done
          python extension/package.py --output extension-check
          for archive in extension-check/*.zip; do
            unzip -t "$archive" >/dev/null
          done

  windows:
    name: Windows x64
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      PIDM_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Embed release information
        run: python scripts/write_build_info.py

      - name: Build application
        run: pyinstaller --clean --noconfirm pidm.spec

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build portable archive and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release, build\installer | Out-Null
          python -c "from PIL import Image; image=Image.open('assets/logo.png'); image.save('build/installer/PIDM.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          $portable = "release/PIDM-$env:VERSION-Windows-x64-Portable.zip"
          Compress-Archive -Path "dist/PIDM" -DestinationPath $portable
          $source = (Resolve-Path "dist/PIDM").Path
          $output = (Resolve-Path "release").Path + "\PIDM-$env:VERSION-Windows-x64-Setup.exe"
          $icon = (Resolve-Path "build/installer/PIDM.ico").Path
          $productVersion = (($env:VERSION -split "[-+]")[0]) + ".0"
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          & $makensis `
            "/DVERSION=$env:VERSION" `
            "/DPRODUCT_VERSION=$productVersion" `
            "/DSOURCE_DIR=$source" `
            "/DOUT_FILE=$output" `
            "/DICON_FILE=$icon" `
            "packaging/windows/PIDM.nsi"

      - uses: actions/upload-artifact@v4
        with:
          name: pidm-windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      PIDM_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxcb-cursor0

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Embed release information
        run: python scripts/write_build_info.py

      - name: Build application
        run: pyinstaller --clean --noconfirm pidm.spec

      - name: Build portable archive and Debian package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          tar -C dist -czf \
            "release/PIDM-${VERSION}-Linux-x64-Portable.tar.gz" PIDM

          PACKAGE_ROOT="build/debian/pidm"
          install -d \
            "${PACKAGE_ROOT}/DEBIAN" \
            "${PACKAGE_ROOT}/opt/pidm" \
            "${PACKAGE_ROOT}/usr/share/applications" \
            "${PACKAGE_ROOT}/usr/share/icons/hicolor/256x256/apps"
          cp -a dist/PIDM/. "${PACKAGE_ROOT}/opt/pidm/"
          install -m 644 packaging/linux/pidm.desktop \
            "${PACKAGE_ROOT}/usr/share/applications/pidm.desktop"
          install -m 644 assets/logo.png \
            "${PACKAGE_ROOT}/usr/share/icons/hicolor/256x256/apps/pidm.png"
          INSTALLED_SIZE="$(du -sk "${PACKAGE_ROOT}/opt/pidm" | cut -f1)"
          cat > "${PACKAGE_ROOT}/DEBIAN/control" <<EOF
          Package: pidm
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Installed-Size: ${INSTALLED_SIZE}
          Maintainer: Saeed Masoudi
          Depends: libc6, libegl1, libgl1, libxkbcommon0, libxcb-cursor0
          Homepage: https://github.com/saeedmasoudie/PIDM
          Description: Cross-platform desktop download manager
           PIDM provides resumable and segmented downloads, queues, schedules,
           media extraction, torrent support, and browser integration.
          EOF
          dpkg-deb --build --root-owner-group \
            "${PACKAGE_ROOT}" \
            "release/PIDM-${VERSION}-Linux-x64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: pidm-linux-x64
          path: release/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      PIDM_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Embed release information
        run: python scripts/write_build_info.py

      - name: Build application
        run: pyinstaller --clean --noconfirm pidm.spec

      - name: Apply ad-hoc application signature
        run: |
          codesign --force --deep --sign - dist/PIDM.app
          codesign --verify --deep --strict dist/PIDM.app

      - name: Build disk image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          hdiutil create \
            -volname "PIDM ${VERSION}" \
            -srcfolder dist/PIDM.app \
            -format UDZO \
            -ov \
            -o "release/PIDM-${VERSION}-macOS-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: pidm-macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  extensions:
    name: Browser extensions
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package extensions
        run: python extension/package.py --output release

      - uses: actions/upload-artifact@v4
        with:
          name: pidm-browser-extensions
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs:
      - validate
      - windows
      - linux
      - macos
      - extensions
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release page and checksums
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          PREVIOUS_TAG="$(
            git tag --list --sort=-version:refname \
              | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' \
              | grep -Fvx "${TAG}" \
              | head -n 1 \
              || true
          )"

          find artifacts -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed -E 's#  artifacts/[^/]+/#  #' \
            > SHA256SUMS.txt

          if [[ -n "$PREVIOUS_TAG" ]]; then
            CHANGE_DETAILS="$(
              git log --no-merges --format='%b' \
                "${PREVIOUS_TAG}..HEAD"
            )"
          else
            CHANGE_DETAILS="$(
              git log --no-merges --format='%b' -n 50
            )"
          fi
          CHANGE_DETAILS="$(
            printf '%s\n' "$CHANGE_DETAILS" \
              | sed \
                  -e '/^Figma-Prompt-ID:/d' \
                  -e '/^Figma-Session-ID:/d' \
                  -e '/^[[:space:]]*$/d' \
                  -E -e 's/^[[:space:]]*[-*]?[[:space:]]*/- /'
          )"

          {
            echo "# PIDM ${TAG}"
            echo
            echo "## Changes"
            echo
            if [[ -n "$CHANGE_DETAILS" ]]; then
              printf '%s\n' "$CHANGE_DETAILS"
            else
              echo "- No detailed change descriptions were provided."
            fi
            echo
            echo "## Downloads"
            echo
            echo "| Platform | Package | Size | Download |"
            echo "| :--- | :--- | ---: | :---: |"
            find artifacts -type f | sort | while read -r file; do
              name="$(basename "$file")"
              case "$name" in
                *Windows*x64*Setup.exe)
                  platform="Windows x64"
                  package="Setup EXE"
                  label="Windows Setup"
                  badge="https://img.shields.io/badge/Download-Windows_Setup-0078D4?style=for-the-badge&logo=windows11&logoColor=white"
                  ;;
                *Windows*x64*Portable.zip)
                  platform="Windows x64"
                  package="Portable ZIP"
                  label="Windows Portable"
                  badge="https://img.shields.io/badge/Download-Windows_Portable-0078D4?style=for-the-badge&logo=windows11&logoColor=white"
                  ;;
                *Linux*x64.deb)
                  platform="Linux x64"
                  package="DEB installer"
                  label="Linux DEB"
                  badge="https://img.shields.io/badge/Download-Linux_DEB-FCC624?style=for-the-badge&logo=linux&logoColor=black"
                  ;;
                *Linux*x64*Portable.tar.gz)
                  platform="Linux x64"
                  package="Portable TAR.GZ"
                  label="Linux Portable"
                  badge="https://img.shields.io/badge/Download-Linux_Portable-FCC624?style=for-the-badge&logo=linux&logoColor=black"
                  ;;
                *macOS*x64.dmg)
                  platform="macOS"
                  package="Intel DMG"
                  label="macOS Intel"
                  badge="https://img.shields.io/badge/Download-macOS_Intel-111111?style=for-the-badge&logo=apple&logoColor=white"
                  ;;
                *macOS*arm64.dmg)
                  platform="macOS"
                  package="Apple Silicon DMG"
                  label="macOS Apple Silicon"
                  badge="https://img.shields.io/badge/Download-Apple_Silicon-111111?style=for-the-badge&logo=apple&logoColor=white"
                  ;;
                *chromium*.zip)
                  platform="Extension"
                  package="Chromium ZIP"
                  label="Chromium Extension"
                  badge="https://img.shields.io/badge/Download-Chromium_Extension-4285F4?style=for-the-badge&logo=googlechrome&logoColor=white"
                  ;;
                *firefox*.zip)
                  platform="Extension"
                  package="Firefox ZIP"
                  label="Firefox Extension"
                  badge="https://img.shields.io/badge/Download-Firefox_Extension-FF7139?style=for-the-badge&logo=firefoxbrowser&logoColor=white"
                  ;;
                *)
                  continue
                  ;;
              esac
              size="$(du -h "$file" | cut -f1)"
              echo "| **${platform}** | ${package} | ${size} | [![${label}](${badge})](${RELEASE_URL}/${name}) |"
            done
            echo
            echo "> **Extensions:** Extract the ZIP first. In Chromium browsers use"
            echo "> **Extensions → Developer mode → Load unpacked**. In Firefox use"
            echo "> \`about:debugging#/runtime/this-firefox\` → **Load Temporary Add-on**."
            echo "> PIDM must be running; temporary Firefox add-ons are removed on restart."
            echo
            echo "## SHA-256 checksums"
            echo
            echo '```text'
            cat SHA256SUMS.txt
            echo '```'
          } > RELEASE_NOTES.md

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/**/*

      - name: Update release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git tag --force "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}" --force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PIDM v${{ needs.validate.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*
            SHA256SUMS.txt

      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          {
            find artifacts -type f -printf '%f\n'
            echo "SHA256SUMS.txt"
          } | sort -u > expected-assets.txt
          gh release view "$TAG" --json assets --jq '.assets[].name' \
            | while read -r asset; do
                [[ -n "$asset" ]] || continue
                if ! grep -Fxq "$asset" expected-assets.txt; then
                  gh release delete-asset "$TAG" "$asset" --yes
                fi
              done
