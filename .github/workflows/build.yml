name: Build PIDM

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: PIDM-windows-x64
          - name: Linux
            os: ubuntu-latest
            artifact: PIDM-linux-x64
          - name: macOS
            os: macos-latest
            artifact: PIDM-macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Embed release information
        run: python scripts/write_build_info.py

      - name: Prepare application logo
        shell: bash
        run: |
          if [ ! -f assets/logo.png ]; then
            cp extension/logo.png assets/logo.png
          fi

      - name: Build application
        run: pyinstaller --clean --noconfirm pidm.spec

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/PIDM -DestinationPath release/${{ matrix.artifact }}.zip

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release
          tar -C dist -czf release/${{ matrix.artifact }}.tar.gz PIDM

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            dist/PIDM.app release/${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

      - name: Attach desktop build to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  extensions:
    name: Browser extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package extensions
        run: python extension/package.py --output release
      - uses: actions/upload-artifact@v4
        with:
          name: PIDM-browser-extensions
          path: release/*.zip
          if-no-files-found: error
      - name: Attach extensions to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
